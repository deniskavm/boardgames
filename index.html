<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Моя полка настолок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700&family=Commissioner:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: одна колонка карточек-«коробок» под ширину iPhone (402pt), липкая панель фильтров сверху */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --surface-2: #e3e7ec;
  --fg: #171b22;
  --muted: #5b6573;
  --line: #d5dbe2;
  --accent: #2f5bd3;
  --accent-ink: #ffffff;
  --good: #1f8a52;
  --ok: #b07a12;
  --transit: #b8620b;
  --transit-soft: #fbefe0;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 6px 18px rgba(20,30,50,.06);
  --f-display: "Tektur", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Commissioner", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #181c22; --surface-2: #232931; --fg: #e9edf2;
    --muted: #96a1af; --line: #2b323b; --accent: #7fa2ff; --accent-ink: #0f1216;
    --good: #4cc98a; --ok: #e3b04b; --transit: #f2a748; --transit-soft: #2c2214; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #181c22; --surface-2: #232931; --fg: #e9edf2;
  --muted: #96a1af; --line: #2b323b; --accent: #7fa2ff; --accent-ink: #0f1216;
  --good: #4cc98a; --ok: #e3b04b; --transit: #f2a748; --transit-soft: #2c2214; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.wrap { overflow-x: clip; max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 32px; }

header.top { padding-block: 20px 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.05; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.count { font-family: var(--f-data); font-size: 12px; line-height: 1.4; text-align: right; color: var(--muted); white-space: nowrap; padding-bottom: 4px; }

/* Липкая панель фильтров */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-inline: -16px; padding-inline: 16px; padding-block: 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
.searchrow { display: flex; gap: 8px; align-items: stretch; }
.search { position: relative; flex: 1; min-width: 0; }
.ftoggle { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; min-height: 42px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 600 14px/1 var(--f-body); cursor: pointer; }
.ftoggle svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.ftoggle[aria-expanded="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.ftoggle b { font: 700 11px/1 var(--f-data); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 3px 6px; }
.filters { display: grid; gap: 10px; }
.filters[hidden] { display: none; }
.search input {
  width: 100%; font: inherit; font-size: 16px; /* 16px — iOS не зумит поле */
  padding: 10px 12px 10px 36px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; stroke: var(--muted); }
.players { display: flex; align-items: center; gap: 10px; min-width: 0; }
.seg { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; min-width: 0; }
.chip.transit[aria-pressed="true"] { background-color: var(--transit); border-color: var(--transit); color: #fff; }
.sortseg { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-width: 0; }
.sortseg .chip { padding-inline: 4px; white-space: nowrap; }
.sortseg .chip:first-child { border-radius: 10px 0 0 10px; }
.sortseg .chip:last-child { border-radius: 0 10px 10px 0; border-left: 0; }
.chip.sel.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.fld { display: grid; gap: 3px; min-width: 0; }
.fld > span { font: 600 10px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-left: 2px; }
.selects { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.15fr); gap: 6px; }
.chip {
  font: 500 13px/1 var(--f-body); color: var(--fg);
  padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line);
  background-color: var(--surface); cursor: pointer; min-height: 38px; min-width: 0; width: 100%;
}
.chip[aria-pressed="true"] { background-color: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.sel { padding-left: 8px; padding-right: 20px; appearance: none; -webkit-appearance: none; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
  font-size: 16px; /* iOS не зумит поле */
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(-45deg, transparent 50%, var(--muted) 50%);
  background-position: calc(100% - 12px) 16px, calc(100% - 7px) 16px; background-size: 5px 5px; background-repeat: no-repeat; }
.lbl { flex: none; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Список */
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 14px; }
.list > *, .expbox > * { min-width: 0; max-width: 100%; }
.card.nested { margin-left: 22px; margin-top: -4px; position: relative; overflow: visible; }
.card.nested::before { content: ""; position: absolute; left: -13px; top: -12px; width: 9px; height: 40px;
  border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); border-bottom-left-radius: 8px; }
.card.nested .head { grid-template-columns: 72px minmax(0, 1fr); }
.card.nested .cover { width: 72px; }
.card.nested .ph { font-size: 18px; }
.card.nested > .head, .card.nested > .body { border-radius: var(--r); }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
.head { min-width: 0; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; padding: 12px; width: 100%; text-align: left;
  background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
.cover { position: relative; width: 92px; aspect-ratio: 1; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .art { position: absolute; inset: 0; }
.cover .art svg { width: 100%; height: 100%; display: block; }
.cover .art .plus { position: absolute; right: 5px; bottom: 5px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; display: grid; place-items: center; font: 700 16px/1 var(--f-body); }
.cover img.repo-cover { position: absolute; inset: 0; }
.ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 6px;
  font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .04em; color: #fff; }
.ph small { display: block; font: 500 8.5px/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; opacity: .8; margin-top: 4px; }
.info { min-width: 0; display: grid; align-content: start; gap: 6px; }
.titlerow > div:first-child { min-width: 0; flex: 1; }
.titlerow { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.name { overflow-wrap: anywhere; font-family: var(--f-display); font-weight: 700; font-size: 18px; line-height: 1.15; margin: 0; text-wrap: balance; }
.orig { overflow-wrap: anywhere; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.rating { flex: none; display: grid; justify-items: center; gap: 2px; }
.rating b { font: 700 15px/1 var(--f-data); color: var(--accent-ink); background: var(--good);
  padding: 6px 7px; border-radius: 8px; font-variant-numeric: tabular-nums; min-width: 42px; text-align: center; }
.rating span { font: 500 9.5px/1 var(--f-data); color: var(--muted); letter-spacing: .08em; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta i { font-style: normal; display: inline-flex; gap: 4px; align-items: center; }
.meta svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
.weight { display: inline-flex; gap: 2px; align-items: center; }
.weight u { width: 6px; height: 10px; border-radius: 2px; background: var(--line); text-decoration: none; }
.weight u.on { background: var(--ok); }
.more { display: flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--accent); }
.more svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.4; transition: transform .2s; }
.card.open .more svg { transform: rotate(180deg); }

.body { padding: 0 14px 14px; display: grid; gap: 12px; }
.body p { margin: 0; max-width: 65ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11.5px; padding: 4px 8px; border-radius: 6px; background: var(--surface-2); color: var(--fg); }
dl.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 13px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: 600 13px/1 var(--f-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--fg); text-decoration: none; cursor: pointer; min-height: 38px; display: inline-flex; align-items: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.badge { display: inline-block; font: 600 10px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase;
  padding: 4px 6px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); margin-bottom: 4px; }
.expof { color: var(--accent); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.ph .plus { position: absolute; right: 5px; bottom: 5px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.45);
  display: grid; place-items: center; font: 700 16px/1 var(--f-body); }
.card.flash { outline: 2px solid var(--accent); outline-offset: 2px; }
.section-h { display: flex; align-items: baseline; gap: 8px; margin: 10px 2px -2px; font: 700 13px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.section-h b { font: 500 12px/1 var(--f-data); color: var(--muted); }
.section-h.away { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.section-h.transit { color: var(--transit); margin-top: 22px; padding-top: 16px; border-top: 1.5px dashed var(--transit); }
.section-h svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; align-self: center; }
/* Пунктир рисуем фоном псевдоэлемента: dashed-рамка в Safari на высоких блоках рвётся */
.card.coming { position: relative; border: 0; background: var(--transit-soft); box-shadow: none; }
.card.coming::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
  --d: var(--transit);
  background:
    linear-gradient(90deg, var(--d) 60%, transparent 0) top left / 10px 2px repeat-x,
    linear-gradient(90deg, var(--d) 60%, transparent 0) bottom left / 10px 2px repeat-x,
    linear-gradient(180deg, var(--d) 60%, transparent 0) top left / 2px 10px repeat-y,
    linear-gradient(180deg, var(--d) 60%, transparent 0) top right / 2px 10px repeat-y; }
.card.coming.nested::before { border-color: var(--transit); opacity: .6; }
.card.coming .cover::after { content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(-45deg, transparent 0 9px, rgba(255,255,255,.14) 9px 18px); pointer-events: none; }
.ribbon { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; background: var(--transit); color: #fff;
  font: 700 9px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; text-align: center; padding: 5px 0; }
.badge.loc { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.badge.transit { background: var(--transit); color: #fff; }
.rating b.none { background: var(--surface-2); color: var(--muted); }
.exptoggle { box-sizing: border-box; max-width: calc(100% - 22px); overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 12px; width: calc(100% - 22px);
  margin: -8px 0 0 22px; padding: 9px 12px; min-height: 40px; border: 1px solid var(--line); border-top: 0;
  border-radius: 0 0 12px 12px; background: var(--surface-2); color: var(--fg); font: 600 13px/1.2 var(--f-body); cursor: pointer; text-align: left; position: relative; }
.exptoggle::before { content: ""; position: absolute; left: -13px; top: -4px; width: 9px; height: 24px;
  border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); border-bottom-left-radius: 8px; }
.exptoggle .et-l { display: inline-flex; align-items: center; gap: 6px; flex: none; color: var(--accent); }
.exptoggle svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.4; transition: transform .2s; }
.exptoggle.open svg { transform: rotate(90deg); }
.exptoggle .et-r { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; font-size: 12px; color: var(--muted); }
.exptoggle.coming { border-color: var(--transit); border-style: dashed; background: var(--transit-soft); }
.exptoggle.coming .et-l { color: var(--transit); }
.exptoggle.coming::before { border-color: var(--transit); opacity: .6; }
@media (prefers-reduced-motion: reduce) { .exptoggle svg { transition: none; } }
.tr { display: grid; justify-items: end; gap: 8px; }
.viewseg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.vbtn { width: 40px; height: 34px; display: grid; place-items: center; border: 0; background: none; color: var(--muted); cursor: pointer; }
.vbtn + .vbtn { border-left: 1px solid var(--line); }
.vbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.vbtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* Плитки в две колонки */
.list.grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.list.grid > .section-h, .list.grid > .empty, .list.grid > .exptoggle, .list.grid > .card.open { grid-column: 1 / -1; }
.list.grid > .card:not(.open) { border-radius: 10px; }
.list.grid > .card:not(.open) .head { grid-template-columns: 1fr; gap: 5px; padding: 5px; height: 100%; align-content: start; }
.list.grid > .card:not(.open) .cover { width: 100%; border-radius: 6px; }
.list.grid > .card:not(.open) .ph { font-size: 24px; }
.list.grid > .card:not(.open) .ph small { display: none; }
.list.grid > .card:not(.open) .ribbon { font-size: 7.5px; padding: 3px 0; letter-spacing: .1em; }
.list.grid > .card:not(.open) .info { gap: 2px; padding: 0 2px 2px; }
.list.grid > .card:not(.open) .name { font-size: 12.5px; line-height: 1.2; text-wrap: pretty;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.list.grid > .card:not(.open) .expcount, .list.grid > .card:not(.open) .orig, .list.grid > .card:not(.open) .more,
.list.grid > .card:not(.open) .weight, .list.grid > .card:not(.open) .meta i:nth-child(n+3) { display: none; }
.list.grid > .card:not(.open) .titlerow { display: block; }
.list.grid > .card:not(.open) .rating { position: absolute; top: 9px; right: 9px; z-index: 2; }
.list.grid > .card:not(.open) .rating span { display: none; }
.list.grid > .card:not(.open) .rating b { font-size: 11px; padding: 3px 4px; min-width: 0; border-radius: 5px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.list.grid > .card:not(.open) .badge { font-size: 8px; padding: 2px 4px; margin-bottom: 2px; letter-spacing: .04em; }
.list.grid > .card:not(.open) .meta { font-size: 10.5px; gap: 0 6px; flex-wrap: nowrap; overflow: hidden; }
.list.grid > .card:not(.open) .meta svg { width: 11px; height: 11px; }
.list.grid > .card.coming:not(.open) .badge.transit { display: none; }
.meta i { white-space: nowrap; }
.list.grid > .card:not(.open) .meta { gap: 0 5px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.list.grid > .card:not(.open) .meta i { gap: 2px; flex: none; }
.list.grid > .card:not(.open) .meta .u { display: none; }
.list.grid > .card:not(.open) .meta i:nth-child(2)::after { content: "′"; }
.list.grid > .card { position: relative; }
.list.grid .card.nested { margin: 0; }
.list.grid .card.nested::before, .list.grid .exptoggle::before { display: none; }
.list.grid .exptoggle { width: 100%; margin: -4px 0 0; border-top: 1px solid var(--line); border-radius: 12px; }
.list.grid .exptoggle.coming { border-top-style: dashed; border-color: var(--transit); }
.expbox { display: grid; gap: 8px; padding-top: 4px; border-top: 1px solid var(--line); }
.expbox-h { font: 700 11px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 10px; }
.expbox .card.nested { margin: 0; box-shadow: none; background: var(--bg); }
.expbox .card.nested.coming { background: var(--transit-soft); }
.expbox .card.nested::before { display: none; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; }
.note { font-size: 12px; color: var(--muted); margin-top: 18px; }
@media (prefers-reduced-motion: reduce) { .more svg { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Моя полка<br>настолок</h1>
    <div class="tr">
      <div class="count" id="count"></div>
      <div class="viewseg" role="group" aria-label="Вид">
        <button class="vbtn" data-view="list" aria-pressed="true" aria-label="Списком"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="5" rx="1"/><rect x="3" y="15" width="5" height="5" rx="1"/><path d="M11 6.5h10M11 17.5h10"/></svg></button>
        <button class="vbtn" data-view="grid" aria-pressed="false" aria-label="Плитками"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></button>
      </div>
    </div>
  </header>

  <div class="bar">
    <div class="searchrow">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Поиск по названию или тегу" aria-label="Поиск" autocomplete="off">
      </label>
      <button class="ftoggle" id="ftoggle" aria-expanded="false" aria-controls="filters">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span>Фильтры</span><b id="fcount" hidden></b>
      </button>
    </div>
    <div class="filters" id="filters" hidden>
    <div class="players" role="group" aria-label="Число игроков">
      <span class="lbl">Игроки</span>
      <div class="seg">
        <button class="chip" data-players="1" aria-pressed="false">1</button>
        <button class="chip" data-players="2" aria-pressed="false">2</button>
        <button class="chip" data-players="3" aria-pressed="false">3</button>
        <button class="chip" data-players="4" aria-pressed="false">4</button>
        <button class="chip" data-players="5" aria-pressed="false">5+</button>
      </div>

// «Соло» — все игры, где можно играть одному
const genresOf = g => {
  const b = g.base ? GAMES.find(x => x.id === g.base) || g : g;
  const gs = (GENRES[b.id] || []).slice();
  if (b.pmin === 1) gs.push("solo");
  return gs;
};

// Статусы из файла games.csv рядом со страницей: «активна» — показывать, «нет» — скрыть
const INACTIVE = new Set();
const isActive = g => !INACTIVE.has(g.id) && !(g.base && INACTIVE.has(g.base));
function parseStatus(text) {
  INACTIVE.clear();
  text.replace(/^\uFEFF/, "").split(/\r?\n/).forEach((line, i) => {
    const cols = line.split(";").map(x => x.trim());
    if (i === 0 && /^id$/i.test(cols[0])) return;
    const id = cols[0], st = (cols[cols.length - 1] || "").toLowerCase();
    if (id && /^(нет|не активна|неактивна|no|0)$/.test(st)) INACTIVE.add(id);
  });
}
function loadStatus() {
  fetch("games.csv", { cache: "no-store" })
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(t => { parseStatus(t); render(); })
    .catch(() => {});
}

function matches(g) {
  if (!isActive(g)) return false;
  if (state.genre && !genresOf(g).includes(state.genre)) return false;
  if (state.avail === "shelf" && g.coming) return false;
  if (state.avail === "coming" && !g.coming) return false;
  if (state.loc && locOf(g) !== state.loc) return false;
  for (const p of state.players) if (p < g.pmin || p > g.pmax) return false;
  if (state.time === "90" && g.tmin > 90) return false;
  if (state.time === "120" && g.tmin > 120) return false;
  if (state.time === "999" && g.tmax < 120) return false;
  if (state.weight && g.weight == null) return false;
  if (state.weight === "mid" && g.weight >= 3.5) return false;
  if (state.weight === "heavy" && g.weight < 3.5) return false;
  if (state.q) {
    const hay = [g.name, g.orig, ...g.tags].join(" ").toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}
const sorters = {
  rating: (a, b) => (b.bgg ?? 0) - (a.bgg ?? 0) || (a.rank || 1e9) - (b.rank || 1e9),
  name: (a, b) => a.name.localeCompare(b.name, "ru"),
  weight: (a, b) => (b.weight ?? 0) - (a.weight ?? 0),
  year: (a, b) => b.year - a.year
};

function card(g, nested) {
  const open = state.open.has(g.id);
  const plus = g.base ? '<span class="plus">+</span>' : '';
  const cover = COVERS[g.id]
      ? '<div class="art" role="img" aria-label="' + esc(g.name) + '">' + COVERS[g.id] + plus + '</div>'
      : '<div class="ph" style="background:linear-gradient(140deg,' + g.hue[0] + ',' + g.hue[1] + ')">' +
          '<div>' + esc(g.initials) + '</div>' + plus + '</div>';
  const baseGame = g.base ? GAMES.find(x => x.id === g.base) : null;
  const exps = GAMES.filter(x => x.base === g.id);
  const time = g.tmin === g.tmax ? g.tmin : g.tmin + "–" + g.tmax;
  return '<article class="card' + (open ? " open" : "") + (nested ? " nested" : "") + (g.coming ? " coming" : "") + '" id="g-' + g.id + '">' +
    '<button class="head" aria-expanded="' + open + '" aria-controls="b-' + g.id + '" data-toggle="' + g.id + '">' +
      '<div class="cover">' + cover + (g.coming ? '<span class="ribbon">В пути</span>' : '') + '</div>' +
      '<div class="info">' +
        '<div class="titlerow"><div>' + (g.coming ? '<span class="badge transit">Едет ко мне</span> ' : '') + (state.view === "grid" && !g.base && locOf(g) === "away" ? '<span class="badge loc">Вне дома</span> ' : '') + (g.base ? '<span class="badge">Дополнение</span>' : '') + '<h2 class="name">' + esc(g.name) + '</h2>' +
          '<div class="orig">' + esc(g.orig) + ' · ' + g.year + '</div></div>' +
          '<div class="rating"><b' + (g.bgg == null ? ' class="none">—' : '>' + fmt(g.bgg)) + '</b><span>' + (g.ratingSrc ? g.ratingSrc.toUpperCase() : 'BGG') + '</span></div></div>' +
        '<div class="meta"><i>' + ico.users + g.pmin + '–' + g.pmax + '</i><i>' + ico.clock + time + '<span class="u"> мин</span></i>' +
          (g.weight != null ? '<i>' + weightBars(g.weight) + fmt(g.weight) + '</i>' : '') +
          (exps.length ? '<i class="expcount">+' + exps.length + ' доп.</i>' : '') + '</div>' +
        '<div class="more">' + (open ? "Свернуть" : "Подробнее") + ico.chev + '</div>' +
      '</div>' +
    '</button>' +
    '<div class="body" id="b-' + g.id + '"' + (open ? "" : " hidden") + '>' +
      '<p>' + esc(g.desc) + '</p>' +
      '<div class="tags">' + g.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join("") + '</div>' +
      '<dl class="facts">' +
        (baseGame ? '<dt>Нужна база</dt><dd><button class="expof" data-goto="' + baseGame.id + '">' + esc(baseGame.name) + '</button></dd>' : '') +
        (exps.length && !(state.view === "grid" && !nested) ? '<dt>Дополнения</dt><dd>' + exps.map(x => '<button class="expof" data-goto="' + x.id + '">' + esc(x.name) + '</button>').join(', ') + '</dd>' : '') +
        (g.base ? (g.ratingSrc ? '<dt>Оценка</dt><dd>' + fmt(g.bgg) + ' на ' + g.ratingSrc + ' (на BGG нет)</dd>' : '') : '<dt>Место в BGG</dt><dd>' + (g.rank ? '#' + g.rank + ' в общем рейтинге' : 'нет данных') + '</dd>') +
        (state.view === "grid" && !g.base ? '<dt>Где</dt><dd>' + LOC_NAMES[locOf(g)] + (g.coming ? ' (ещё в пути)' : '') + '</dd>' : '') +
      '</dl>' +
      '<div class="actions">' +
        '<a class="btn primary" href="' + bggUrl(g) + '" target="_blank" rel="noopener">Открыть на BGG</a>' +
        '<a class="btn" href="' + teseraUrl(g) + '" target="_blank" rel="noopener">Открыть на Тесере</a>' +
      '</div>' +
      (state.view === "grid" && !nested && exps.length ? '<div class="expbox"><div class="expbox-h">Дополнения · ' + exps.length + '</div>' +
        exps.map(x => card(x, true)).join("") + '</div>' : '') +
    '</div>' +
  '</article>';
}

// Дополнения ставим сразу под их базовой игрой, если она тоже в выдаче
function arrange(sorted) {
  const shown = new Set(sorted.map(g => g.id));
  const out = [];
  for (const g of sorted) {
    if (g.base && shown.has(g.base)) continue;
    out.push({ ...g, nested: false });
    if (g.base) continue;
    const exps = sorted.filter(x => x.base === g.id);
    if (!exps.length) continue;
    if (state.view === "grid") {
      // В плитках дополнения показываются внутри развёрнутой карточки игры
      continue;
    }
    const open = state.expOpen.has(g.id) || !!state.q;
    out.push({ toggle: true, base: g.id, baseName: g.name, coming: g.coming, n: exps.length, open, names: exps.map(x => x.name) });
    if (open) exps.forEach(x => out.push({ ...x, nested: true }));
  }
  return out;
}

function item(g) {
  if (!g.toggle) return card(g, g.nested);
  const label = g.n + " " + plural(g.n, "дополнение", "дополнения", "дополнений");
  return '<button class="exptoggle' + (g.open ? " open" : "") + (g.coming ? " coming" : "") + '" data-exp="' + g.base + '" aria-expanded="' + g.open + '">' +
    '<span class="et-l"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>' + label + '</span>' +
    (g.open ? '<span class="et-r">Свернуть</span>' : '<span class="et-r">' + (state.view === "grid" ? "к игре «" + esc(g.baseName) + "»" : esc(g.names.join(" · "))) + '</span>') +
  '</button>';
}

function setFilters(open) {
  $("#filters").hidden = !open;
  $("#ftoggle").setAttribute("aria-expanded", open);
  store.set("filtersOpen", open ? "1" : "0");
}
setFilters(store.get("filtersOpen") === "1");
$("#ftoggle").addEventListener("click", () => setFilters($("#filters").hidden));

function render() {
  $("#list").classList.toggle("grid", state.view === "grid");
  ["genre", "avail", "loc", "time", "weight"].forEach(id => $("#" + id).classList.toggle("on", !!state[id]));
  const nf = ["genre", "avail", "loc", "time", "weight"].filter(id => state[id]).length + (state.players.size ? 1 : 0);
  $("#fcount").hidden = !nf; $("#fcount").textContent = nf;
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === state.view));
  const sorted = GAMES.filter(matches).sort(sorters[state.sort]);
  const coming = arrange(sorted.filter(g => g.coming));
  const mine = arrange(sorted.filter(g => !g.coming && locOf(g) === "me"));
  const away = arrange(sorted.filter(g => !g.coming && locOf(g) === "away"));
  const groups = [mine, away, coming].filter(x => x.length).length;
  const list = sorted;
  const truck = '<svg viewBox="0 0 24 24"><path d="M2 6h11v10H2zM13 10h4l4 4v2h-8z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>';
  const head = (cls, icon, t, n) => '<div class="section-h ' + cls + '">' + icon + t + ' <b>' + n + '</b></div>';
  let html = "";
  const home = '<svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>';
  const user = '<svg viewBox="0 0 24 24"><path d="M14 4H5v16h9"/><path d="M10 12h10M17 8l4 4-4 4"/></svg>';
  if (mine.length) html += (groups > 1 ? head("", home, "У меня", mine.filter(g => !g.toggle).length) : "") + mine.map(item).join("");
  if (away.length) html += (groups > 1 ? head("away", user, "Вне дома", away.filter(g => !g.toggle).length) : "") + away.map(item).join("");
  if (coming.length) html += head("transit", truck, "Едут ко мне", coming.filter(g => !g.toggle).length) + coming.map(item).join("");
  $("#list").innerHTML = list.length ? html
    : '<div class="empty">Под эти фильтры ничего не подходит.<br><button class="btn" id="reset" style="margin-top:12px">Сбросить фильтры</button></div>';
  const ACT = GAMES.filter(isActive);
  const homeG = ACT.filter(g => !g.coming), nb = homeG.filter(g => !g.base).length, ne = homeG.length - nb;
  const nc = ACT.length - homeG.length;
  $("#count").innerHTML = (list.length === ACT.length ? "" : list.length + " из " + ACT.length + "<br>") +
    nb + " " + plural(nb, "игра", "игры", "игр") + (ne ? " + " + ne + " доп." : "") + (nc ? '<br><span style="color:var(--transit)">' + nc + ' в пути</span>' : "");
}

document.addEventListener("click", e => {
  const go = e.target.closest("[data-goto]");
  if (go) {
    const id = go.dataset.goto;
    resetFilters();
    const tg = GAMES.find(x => x.id === id);
    if (tg && tg.base) { state.expOpen.add(tg.base); if (state.view === "grid") state.open.add(tg.base); }
    state.open.add(id); render();
    const el = document.getElementById("g-" + id);
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400); }
    return;
  }
  const vw = e.target.closest("[data-view]");
  if (vw) { if (state.view !== vw.dataset.view) state.open.clear(); state.view = vw.dataset.view; store.set("view", state.view); render(); return; }
  const so = e.target.closest("[data-sort]");
  if (so) {
    state.sort = so.dataset.sort;
    document.querySelectorAll("[data-sort]").forEach(b => b.setAttribute("aria-pressed", b === so));
    render(); return;
  }
  const ex = e.target.closest("[data-exp]");
  if (ex) {
    const id = ex.dataset.exp;
    state.expOpen.has(id) ? state.expOpen.delete(id) : state.expOpen.add(id);
    render(); return;
  }
  const t = e.target.closest("[data-toggle]");
  if (t) {
    const id = t.dataset.toggle;
    state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    render(); return;
  }
  const p = e.target.closest("[data-players]");
  if (p) {
    const n = +p.dataset.players;
    state.players.has(n) ? state.players.delete(n) : state.players.add(n);
    p.setAttribute("aria-pressed", state.players.has(n));
    render(); return;
  }
  if (e.target.id === "reset") {
    resetFilters();
    render();
  }
});
$("#q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
["genre", "avail", "loc"].forEach(id => $("#" + id).addEventListener("change", e => { state[id] = e.target.value; render(); }));
function resetFilters() {
  state.players.clear(); state.q = state.time = state.weight = state.genre = state.avail = state.loc = "";
  document.querySelectorAll("[data-players]").forEach(b => b.setAttribute("aria-pressed", "false"));
  ["q", "time", "weight", "genre", "avail", "loc"].forEach(id => { $("#" + id).value = ""; });
}
$("#time").addEventListener("change", e => { state.time = e.target.value; render(); });
$("#weight").addEventListener("change", e => { state.weight = e.target.value; render(); });

// Старые фото коробок больше не используются: удаляем их из памяти браузера
try { Object.keys(localStorage).filter(k => k.startsWith("cover:")).forEach(k => localStorage.removeItem(k)); } catch (e) {}

render();
loadStatus();
</script>
</body>
</html>
